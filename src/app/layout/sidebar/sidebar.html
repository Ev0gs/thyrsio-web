<nav aria-label="Navigation principale"
     class="flex h-full flex-col gap-6 overflow-y-auto border-b border-border bg-muted/40 px-3 py-5 md:border-b-0 md:border-r">

  <div class="flex items-center gap-2.5 px-2.5">
    <div aria-hidden="true"
         class="flex size-8 items-center justify-center rounded-lg bg-primary text-base font-bold text-primary-foreground">T</div>
    <div class="flex flex-col leading-tight">
      <span class="text-[15px] font-semibold">Thyrsio</span>
      <span class="text-xs text-muted-foreground">[Nom du négoce]</span>
    </div>
  </div>

  @for (group of groups; track group.label) {
    <div class="flex flex-col gap-0.5">
      <div class="px-2.5 pb-1.5 text-[11px] font-semibold uppercase tracking-wider text-muted-foreground">
        {{ group.label }}
      </div>

      @for (item of group.items; track item.label) {
        @if (item.route) {
          <!-- #rla : on récupère l'état "actif" du lien pour choisir son style -->
          <a [routerLink]="item.route"
             routerLinkActive
             #rla="routerLinkActive"
             [routerLinkActiveOptions]="{ exact: true }"
             ariaCurrentWhenActive="page"
             class="flex min-h-10 items-center gap-2.5 rounded-lg border px-2.5 text-sm transition-colors"
             [class]="rla.isActive
               ? 'border-border bg-background font-semibold text-primary'
               : 'border-transparent font-medium text-foreground/80 hover:bg-background'">
            <ng-icon [name]="item.icon" size="16" aria-hidden="true" />
            <span class="flex-1">{{ item.label }}</span>
          </a>
        } @else {
          <div aria-disabled="true"
               class="flex min-h-10 items-center gap-2.5 rounded-lg px-2.5 text-sm font-medium text-muted-foreground">
            <ng-icon [name]="item.icon" size="16" aria-hidden="true" />
            <span class="flex-1">{{ item.label }}</span>
            <span class="rounded-full border border-border bg-muted px-2 text-[11px] font-medium">À venir</span>
          </div>
        }
      }
    </div>
  }

  <div class="mt-auto flex items-center gap-2.5 border-t border-border px-2.5 pt-3">
    <button type="button"
            (click)="user.manageAccount()"
            title="Gérer mon compte"
            class="flex min-w-0 flex-1 items-center gap-2.5 rounded-lg py-1 text-left hover:bg-background">
      <span aria-hidden="true"
            class="flex size-8 shrink-0 items-center justify-center rounded-full bg-muted text-[13px] font-semibold">
        {{ user.initials }}
      </span>
      <span class="flex min-w-0 flex-col leading-tight">
        <span class="truncate text-[13px] font-medium">{{ user.name }}</span>
        <span class="text-xs text-muted-foreground">{{ user.isAdmin ? 'Administrateur' : 'Utilisateur' }}</span>
      </span>
    </button>
    <button type="button"
            (click)="user.logout()"
            aria-label="Se déconnecter"
            title="Se déconnecter"
            class="flex size-10 shrink-0 items-center justify-center rounded-lg text-muted-foreground hover:bg-background hover:text-foreground">
      <ng-icon name="lucideLogOut" size="16" aria-hidden="true" />
    </button>
  </div>
</nav>
